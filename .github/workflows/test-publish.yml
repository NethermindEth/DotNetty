name: Test / Publish

on:
  push:
    paths:
      - '.github/workflows/test-publish.yml'
      - 'src/**'
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to NuGet
        default: 'No'
        type: choice
        options:
          - 'No'
          - Staging
          - Production

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: Build
        run: dotnet build -c release

      # - name: Test
      #   run: dotnet test -c release

  publish:
    name: Publish
    needs: test
    if: github.event_name == 'workflow_dispatch' && inputs.publish != 'No'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      NUGET_URL: ${{ inputs.publish == 'Staging' && 'https://int.nugettest.org' || 'https://www.nuget.org' }}
      NUGET_SOURCE: ${{ inputs.publish == 'Staging' && 'https://apiint.nugettest.org' || 'https://api.nuget.org' }}/v3/index.json
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect version
        id: version
        working-directory: src
        run: |
          version=$(sed -n 's|.*<PackageVersion>\(.*\)</PackageVersion>.*|\1|p' Directory.Build.props)
          echo "Detected version $version"
          echo "version=$version" >> $GITHUB_OUTPUT
    
      - name: Set up .NET
        uses: actions/setup-dotnet@v6

      - name: NuGet login
        uses: nuget/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
          audience: ${{ env.NUGET_URL }}
          token-service-url: ${{ env.NUGET_URL }}/api/v2/token
    
      - name: Publish
        run: |
          dotnet pack -c release -p:PackageVersion=${{ steps.version.outputs.version }}.${{ github.run_number }}
          dotnet nuget push build_output/packages/*.nupkg \
            -k "${{ steps.login.outputs.NUGET_API_KEY }}" -s ${{ env.NUGET_SOURCE }}
